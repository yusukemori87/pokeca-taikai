name: 大会情報を更新してサイトを公開

# 実行モードは3つ。cronの種類で自動的に切り替わる。
#   hourly … 毎時17分。軽い巡回だけ。新しく公開された大会を早く反映するため
#   full   … 毎日7:00(JST)。Twitter検索と主催者の全件巡回を含む
#   deep   … 日曜5:00(JST)。長期間さかのぼって取りこぼしを回収する
on:
  schedule:
    - cron: "17 * * * *"    # 毎時（軽量）。0〜10分は世界中の予約が集中するので避ける
    - cron: "0 22 * * *"    # 毎日 7:00 JST（フル）
    - cron: "0 20 * * 6"    # 日曜 5:00 JST（深掘り）
  workflow_dispatch:
  push:
    paths:
      - ".trigger"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # 毎時実行と日次実行でグループを分ける。
  # 同じグループにすると、毎時実行が走った瞬間に日次のフル実行が打ち切られてしまう。
  # コミット段階は fetch→reset→再試行で競合に強くしてあるので、
  # 両者が同時に走っても結果は失われない。
  group: pages-${{ github.event.schedule == '17 * * * *' && 'hourly' || 'full' }}
  cancel-in-progress: true

env:
  MODE: ${{ github.event.schedule == '17 * * * *' && 'hourly' || (github.event.schedule == '0 20 * * 6' && 'deep' || 'full') }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 実行モードを表示
        run: echo "MODE=$MODE"

      - name: 依存パッケージを入れる
        run: |
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Tonamelの公開大会を一覧から拾う
        # JavaScript描画の一覧をヘッドレスブラウザで開いて回収する。
        # Twitterのクレジットは使わない。毎時実行の主役はここ。
        env:
          PUBLIC_TIME_BUDGET: ${{ github.event.schedule == '17 * * * *' && '240' || '600' }}
        run: python scripts/collect_public.py
        continue-on-error: true

      - name: 掲載済み主催者のページから次の大会を拾う
        # 自主大会の多くは非公開なので、本命はこの経路。
        # 毎時は30人ずつ、時刻で区画を変えて一巡させる（数時間で全員を回る）。
        env:
          ORG_PAGE_LIMIT: ${{ github.event.schedule == '17 * * * *' && '40' || (github.event.schedule == '0 20 * * 6' && '200' || '120') }}
          ORG_TIME_BUDGET: ${{ github.event.schedule == '17 * * * *' && '300' || '900' }}
          ORG_POOL: ${{ github.event.schedule == '17 * * * *' && '120' || '0' }}
          ORG_ROTATE_BY_HOUR: ${{ github.event.schedule == '17 * * * *' && '1' || '0' }}
        run: python scripts/collect_orgs.py
        continue-on-error: true

      - name: Twitter から大会情報を集める
        # 毎時は SKIP_TWITTER=1。検索は1日1回で十分だし、
        # 毎時投げるとAPIクレジットを無駄に溶かす。
        # SKIP_TWITTER=1 でも「前回見つけたが未取得の大会」の取得は走る。
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          LOOKBACK_DAYS: ${{ github.event.schedule == '0 20 * * 6' && '120' || vars.LOOKBACK_DAYS || '7' }}
          HORIZON_DAYS: "95"
          FOLLOW_ORGANIZERS: "1"
          ORG_LOOKBACK_DAYS: ${{ github.event.schedule == '0 20 * * 6' && '120' || vars.ORG_LOOKBACK_DAYS || '14' }}
          ORG_PAGES: ${{ github.event.schedule == '0 20 * * 6' && '3' || vars.ORG_PAGES || '1' }}
          ORG_MAX_HANDLES: ${{ vars.ORG_MAX_HANDLES || '40' }}
          ORG_ROTATE_DAYS: ${{ github.event.schedule == '0 20 * * 6' && '1' || vars.ORG_ROTATE_DAYS || '2' }}
          MAX_PAGES_PER_QUERY: ${{ github.event.schedule == '0 20 * * 6' && '8' || vars.MAX_PAGES_PER_QUERY || '4' }}
          SKIP_TWITTER: ${{ github.event.schedule == '17 * * * *' && '1' || vars.SKIP_TWITTER || '0' }}
          FORCE_REFETCH: ${{ vars.FORCE_REFETCH || '0' }}
        run: python scripts/collect.py

      - name: 収集結果を自己点検する
        # 毎時は検索を飛ばしているので、点検しても意味のある比較にならない。
        # それどころか audit.json を上書きして、日次実行が見つけた障害
        # （例: twitterapi.io の402）を消してしまう。だから毎時は走らせない。
        if: env.MODE != 'hourly'
        run: python scripts/audit.py

      - name: サイトを組み立てる
        run: python scripts/build_site.py

      - name: 結果をコミット
        run: |
          set -e
          BR="${GITHUB_REF_NAME}"
          git config user.name  "pokeca-bot"
          git config user.email "bot@users.noreply.github.com"

          # 生成物を退避しておく。
          # 収集中に他のコミットが main に入っていても、リモートの最新に生成物を
          # 上書きし直して push するので、コンフリクトで結果を失うことがない。
          mkdir -p /tmp/out
          for f in data/events.json data/pending.json data/audit.json data/collect_stats.json docs/index.html; do
            [ -f "$f" ] && cp "$f" "/tmp/out/$(basename "$f")"
          done

          # 毎時実行では、大会の中身が変わっていないのにコミットしない。
          # events.json には generated_at や collected_at が入っていて毎回必ず
          # 差分が出るため、放っておくと「中身は同じなのに1.9MBの差分」が
          # 1日24回積み上がり、リポジトリだけが太っていく。
          # 日次・週次は監査結果も更新したいので、この判定はしない。
          if [ "$MODE" = "hourly" ]; then
            git fetch origin "$BR"
            NEW_FP=$(python3 scripts/fingerprint.py /tmp/out/events.json)
            if git show "origin/$BR:data/events.json" > /tmp/old_events.json 2>/dev/null; then
              OLD_FP=$(python3 scripts/fingerprint.py /tmp/old_events.json)
            else
              OLD_FP="none"
            fi
            if [ "$NEW_FP" = "$OLD_FP" ]; then
              echo "大会の中身に変化なし。コミットをスキップします。"
              exit 0
            fi
            echo "大会の中身が変わったのでコミットします。"
          fi

          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"

            [ -f /tmp/out/events.json ]  && cp /tmp/out/events.json  data/events.json
            [ -f /tmp/out/pending.json ] && cp /tmp/out/pending.json data/pending.json
            [ -f /tmp/out/audit.json ]   && cp /tmp/out/audit.json   data/audit.json
            [ -f /tmp/out/collect_stats.json ] && cp /tmp/out/collect_stats.json data/collect_stats.json
            [ -f /tmp/out/index.html ]   && cp /tmp/out/index.html   docs/index.html

            git add data/events.json data/pending.json data/audit.json data/collect_stats.json docs/index.html 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "変更なし。コミットをスキップします。"
              exit 0
            fi
            git commit -m "自動更新[$MODE]: $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') JST"
            if git push origin "HEAD:$BR"; then
              echo "push 成功"
              exit 0
            fi
            echo "push が競合しました。15秒後に再試行します ($i/5)"
            sleep 15
          done
          echo "5回試しても push できませんでした"
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
