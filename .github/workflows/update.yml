name: 大会情報を更新してサイトを公開

on:
  schedule:
    # 毎日1回、日本時間の 7:00（UTCで書く必要があるので前日22:00）
    - cron: "0 22 * * *"
    # 週1回、日曜の朝5時(JST)に深掘り実行。
    # 自主大会の告知は1〜3ヶ月前に出ることがあり、毎日の短い窓(7日)では届かない。
    # ここで長期間さかのぼって取りこぼしを回収する。
    - cron: "0 20 * * 6"
  workflow_dispatch:        # 手動実行ボタン用
  push:
    # .trigger ファイルを更新してpushすると、その場で1回走る。
    # （ワークフロー自身のコミットは GITHUB_TOKEN 経由なので再帰しない）
    paths:
      - ".trigger"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージを入れる
        run: |
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Tonamelの公開大会を一覧から全件拾う
        # JavaScript描画の一覧をヘッドレスブラウザで開いて回収する。
        # Twitterのクレジットは使わない。ここが「公開分100%」の担保。
        run: python scripts/collect_public.py
        continue-on-error: true

      - name: Twitter から大会情報を集める
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          # 毎日回すので、2回目以降は7日ぶんさかのぼれば十分（APIコストが1/6になる）。
          # 初回や取りこぼしを取り戻したい時は、手動実行のとき LOOKBACK_DAYS を大きくする。
          # 週次の深掘り実行(日曜)では長期間さかのぼる
          LOOKBACK_DAYS: ${{ github.event.schedule == '0 20 * * 6' && '120' || vars.LOOKBACK_DAYS || '120' }}
          HORIZON_DAYS: "95"      # 何日先までの大会を載せるか（約3ヶ月）
          FOLLOW_ORGANIZERS: "1"  # キーマンの投稿も直接追う
          # 主催者追跡の深さ。毎日走らせるので最新20件で足りる（取り戻したいときだけ増やす）
          ORG_LOOKBACK_DAYS: ${{ github.event.schedule == '0 20 * * 6' && '120' || vars.ORG_LOOKBACK_DAYS || '120' }}
          ORG_PAGES: ${{ github.event.schedule == '0 20 * * 6' && '3' || vars.ORG_PAGES || '3' }}
          ORG_MAX_HANDLES: ${{ vars.ORG_MAX_HANDLES || '40' }}
          ORG_ROTATE_DAYS: ${{ github.event.schedule == '0 20 * * 6' && '1' || vars.ORG_ROTATE_DAYS || '1' }}
          MAX_PAGES_PER_QUERY: ${{ github.event.schedule == '0 20 * * 6' && '8' || vars.MAX_PAGES_PER_QUERY || '8' }}
          # 検索を飛ばして未取得ぶんだけ再挑戦したいときは SKIP_TWITTER=1
          SKIP_TWITTER: ${{ vars.SKIP_TWITTER || '0' }}
          # 解析ロジックを直したあと、全件をTonamelから取り直したいときは FORCE_REFETCH=1
          FORCE_REFETCH: ${{ vars.FORCE_REFETCH || '0' }}
        run: python scripts/collect.py

      - name: 収集結果を自己点検する
        run: python scripts/audit.py

      - name: サイトを組み立てる
        run: python scripts/build_site.py

      - name: 結果をコミット
        run: |
          set -e
          BR="${GITHUB_REF_NAME}"
          git config user.name  "pokeca-bot"
          git config user.email "bot@users.noreply.github.com"

          # 生成物を退避しておく。
          # 収集中に他のコミットが main に入っていても、リモートの最新に生成物を
          # 上書きし直して push するので、コンフリクトで結果を失うことがない。
          mkdir -p /tmp/out
          for f in data/events.json data/pending.json data/audit.json docs/index.html; do
            [ -f "$f" ] && cp "$f" "/tmp/out/$(basename "$f")"
          done

          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"

            [ -f /tmp/out/events.json ]  && cp /tmp/out/events.json  data/events.json
            [ -f /tmp/out/pending.json ] && cp /tmp/out/pending.json data/pending.json
            [ -f /tmp/out/audit.json ]   && cp /tmp/out/audit.json   data/audit.json
            [ -f /tmp/out/index.html ]   && cp /tmp/out/index.html   docs/index.html

            git add data/events.json data/pending.json data/audit.json docs/index.html 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "変更なし。コミットをスキップします。"
              exit 0
            fi
            git commit -m "自動更新: $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') JST"
            if git push origin "HEAD:$BR"; then
              echo "push 成功"
              exit 0
            fi
            echo "push が競合しました。15秒後に再試行します ($i/5)"
            sleep 15
          done
          echo "5回試しても push できませんでした"
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
