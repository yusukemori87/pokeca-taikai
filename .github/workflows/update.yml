name: 大会情報を更新してサイトを公開

on:
  schedule:
    # 毎日1回、日本時間の 7:00（UTCで書く必要があるので前日22:00）
    - cron: "0 22 * * *"
  workflow_dispatch:        # 手動実行ボタン用

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージを入れる
        run: pip install -r requirements.txt

      - name: Twitter から大会情報を集める
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          # 毎日回すので、2回目以降は7日ぶんさかのぼれば十分（APIコストが1/6になる）。
          # 初回や取りこぼしを取り戻したい時は、手動実行のとき LOOKBACK_DAYS を大きくする。
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '7' }}
          HORIZON_DAYS: "95"      # 何日先までの大会を載せるか（約3ヶ月）
          FOLLOW_ORGANIZERS: "1"  # キーマンの投稿も直接追う
          MAX_PAGES_PER_QUERY: ${{ vars.MAX_PAGES_PER_QUERY || '4' }}
          SKIP_TWITTER: ${{ vars.SKIP_TWITTER || '0' }}
        run: python scripts/collect.py

      - name: サイトを組み立てる
        run: python scripts/build_site.py

      - name: 結果をコミット
        run: |
          git config user.name  "pokeca-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/events.json docs/index.html
          git diff --staged --quiet || git commit -m "自動更新: $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') JST"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
